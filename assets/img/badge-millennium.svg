<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120">
  <title>千禧年学园徽章：科技学园（12齿轮·电路·四角星）</title>
  <defs>
    <radialGradient id="bmBg" cx="50%" cy="36%" r="80%">
      <stop offset="0%" stop-color="#f4fbff"/>
      <stop offset="60%" stop-color="#d6ecf9"/>
      <stop offset="100%" stop-color="#aecfe8"/>
    </radialGradient>
    <linearGradient id="bmCore" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9af0e8"/>
      <stop offset="100%" stop-color="#2f8fe8"/>
    </linearGradient>
  </defs>
  <g stroke-linejoin="round" stroke-linecap="round">
    <!-- 外环底盘 -->
    <circle cx="60" cy="60" r="52" fill="url(#bmBg)" stroke="#10203e" stroke-width="3.5"/>
    <!-- 12 齿轮齿 -->
    <g fill="#10203e">
      <rect x="57" y="1" width="6" height="13" rx="2"/>
      <rect x="57" y="1" width="6" height="13" rx="2" transform="rotate(30 60 60)"/>
      <rect x="57" y="1" width="6" height="13" rx="2" transform="rotate(60 60 60)"/>
      <rect x="57" y="1" width="6" height="13" rx="2" transform="rotate(90 60 60)"/>
      <rect x="57" y="1" width="6" height="13" rx="2" transform="rotate(120 60 60)"/>
      <rect x="57" y="1" width="6" height="13" rx="2" transform="rotate(150 60 60)"/>
      <rect x="57" y="1" width="6" height="13" rx="2" transform="rotate(180 60 60)"/>
      <rect x="57" y="1" width="6" height="13" rx="2" transform="rotate(210 60 60)"/>
      <rect x="57" y="1" width="6" height="13" rx="2" transform="rotate(240 60 60)"/>
      <rect x="57" y="1" width="6" height="13" rx="2" transform="rotate(270 60 60)"/>
      <rect x="57" y="1" width="6" height="13" rx="2" transform="rotate(300 60 60)"/>
      <rect x="57" y="1" width="6" height="13" rx="2" transform="rotate(330 60 60)"/>
    </g>
    <!-- 内外双圈 -->
    <circle cx="60" cy="60" r="43" fill="#ffffff" stroke="#10203e" stroke-width="2.5"/>
    <circle cx="60" cy="60" r="38.5" fill="none" stroke="#2f8fe8" stroke-width="1.6" opacity=".65"/>
    <path d="M 32,32 A 40,40 0 0 1 22,46" fill="none" stroke="#ffffff" stroke-width="3.4" opacity=".75"/>
    <!-- 内环电路折线 + 节点 -->
    <g fill="none" stroke="#2f8fe8" stroke-width="2.5">
      <path d="M 33,48 L 44,48 L 50,42 L 58,42"/>
      <path d="M 87,72 L 76,72 L 70,78 L 62,78"/>
      <path d="M 39,82 L 39,70"/>
      <path d="M 81,38 L 81,50"/>
      <path d="M 58,88 L 58,81"/>
    </g>
    <g fill="#10203e">
      <circle cx="33" cy="48" r="2.6"/>
      <circle cx="58" cy="42" r="2.6"/>
      <circle cx="87" cy="72" r="2.6"/>
      <circle cx="62" cy="78" r="2.6"/>
      <circle cx="39" cy="82" r="2.6"/>
      <circle cx="39" cy="70" r="2.6"/>
      <circle cx="81" cy="38" r="2.6"/>
      <circle cx="81" cy="50" r="2.6"/>
      <circle cx="58" cy="88" r="2.6"/>
      <circle cx="58" cy="81" r="2.6"/>
    </g>
    <!-- 四方位小点 -->
    <g fill="#2f8fe8" stroke="#10203e" stroke-width="1.2">
      <circle cx="60" cy="21.5" r="2.4"/>
      <circle cx="60" cy="98.5" r="2.4"/>
      <circle cx="21.5" cy="60" r="2.4"/>
      <circle cx="98.5" cy="60" r="2.4"/>
    </g>
    <!-- 中心四角星 + 青渐变核心圆 -->
    <path d="M 60,34 L 66.5,53.5 L 86,60 L 66.5,66.5 L 60,86 L 53.5,66.5 L 34,60 L 53.5,53.5 Z"
          fill="#ffd94a" stroke="#10203e" stroke-width="2.5"/>
    <path d="M 60,42 L 63.8,56.2 L 78,60 L 63.8,63.8 L 60,78 L 56.2,63.8 L 42,60 L 56.2,56.2 Z"
          fill="#ffc93c" opacity=".7"/>
    <circle cx="60" cy="60" r="14.5" fill="url(#bmCore)" stroke="#10203e" stroke-width="2.5"/>
    <path d="M 52,54 Q 56,50 62,51" fill="none" stroke="#ffffff" stroke-width="2.4" opacity=".8"/>
    <circle cx="55" cy="57" r="1.4" fill="#ffffff" opacity=".9"/>
  </g>
</svg>
