<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96">
  <title>头像：爱丽丝（青灰双马尾·方框光环·亮蓝眼）</title>
  <defs>
    <radialGradient id="alBg" cx="50%" cy="34%" r="80%">
      <stop offset="0%" stop-color="#f4fffd"/>
      <stop offset="55%" stop-color="#d2f5f1"/>
      <stop offset="100%" stop-color="#a4e2db"/>
    </radialGradient>
    <linearGradient id="alHair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#628795"/>
      <stop offset="100%" stop-color="#36505b"/>
    </linearGradient>
    <linearGradient id="alEye" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6fe3ff"/>
      <stop offset="100%" stop-color="#2f8fe8"/>
    </linearGradient>
    <linearGradient id="alTie" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2c3f5c"/>
      <stop offset="100%" stop-color="#101f38"/>
    </linearGradient>
  </defs>
  <g stroke-linejoin="round" stroke-linecap="round">
    <!-- 浅青圆底 -->
    <circle cx="48" cy="48" r="46" fill="url(#alBg)"/>
    <circle cx="48" cy="48" r="42.5" fill="none" stroke="#ffffff" stroke-width="1.6" opacity=".6"/>
    <!-- 方框光环（辉光+描边+四角节点） -->
    <rect x="28.5" y="3" width="39" height="27" rx="9.5" fill="#35d0c0" opacity=".16"/>
    <rect x="30.5" y="5.5" width="35" height="22" rx="8.5" fill="none" stroke="#35d0c0" stroke-width="3.5"/>
    <g fill="#35d0c0" stroke="#0a1428" stroke-width="1">
      <circle cx="48" cy="5.5" r="2.2"/>
      <circle cx="48" cy="27.5" r="2.2"/>
      <circle cx="30.5" cy="16.5" r="2.2"/>
      <circle cx="65.5" cy="16.5" r="2.2"/>
    </g>
    <!-- 双马尾（脑后） -->
    <g transform="rotate(-10 19.5 64)">
      <ellipse cx="19.5" cy="64" rx="8" ry="18.5" fill="url(#alHair)" stroke="#10203e" stroke-width="2"/>
      <ellipse cx="17" cy="57" rx="2.6" ry="8" fill="#ffffff" opacity=".32"/>
      <path d="M 19.5,81 Q 18,85 20.5,88" fill="none" stroke="#10203e" stroke-width="1.6" opacity=".55"/>
    </g>
    <g transform="rotate(10 76.5 64)">
      <ellipse cx="76.5" cy="64" rx="8" ry="18.5" fill="url(#alHair)" stroke="#10203e" stroke-width="2"/>
      <ellipse cx="74.5" cy="57" rx="2.6" ry="8" fill="#ffffff" opacity=".32"/>
      <path d="M 76.5,81 Q 78,85 75.5,88" fill="none" stroke="#10203e" stroke-width="1.6" opacity=".55"/>
    </g>
    <!-- 头与脸 -->
    <circle cx="48" cy="54" r="24" fill="url(#alHair)" stroke="#10203e" stroke-width="2.5"/>
    <circle cx="48" cy="56.5" r="19.5" fill="#fff1e6" stroke="#10203e" stroke-width="2.2"/>
    <!-- 齐刘海（分缕+锯齿发梢） -->
    <path d="M 29,50 Q 28.5,36.5 48,35 Q 67.5,36.5 67,50 L 62.5,46.5 L 58.5,51 L 54,46.8 L 48,51 L 42,46.8 L 38,51 L 34,46.5 Z"
          fill="url(#alHair)" stroke="#10203e" stroke-width="2"/>
    <path d="M 36,42 Q 42,36.5 52,37.5" fill="none" stroke="#ffffff" stroke-width="2.4" opacity=".38"/>
    <path d="M 55,39 Q 59,41 61,45" fill="none" stroke="#ffffff" stroke-width="1.6" opacity=".28"/>
    <!-- 侧发缕 -->
    <path d="M 29.5,48 Q 25,62 27,76 L 32,74 Q 30,62 32.5,52 Z" fill="url(#alHair)" stroke="#10203e" stroke-width="1.8"/>
    <path d="M 66.5,48 Q 71,62 69,76 L 64,74 Q 66,62 63.5,52 Z" fill="url(#alHair)" stroke="#10203e" stroke-width="1.8"/>
    <!-- 眉眼 -->
    <path d="M 36.6,56.2 Q 40,54.8 43.2,56.2" fill="none" stroke="#10203e" stroke-width="1.6"/>
    <path d="M 52.8,56.2 Q 56,54.8 59.4,56.2" fill="none" stroke="#10203e" stroke-width="1.6"/>
    <ellipse cx="40.5" cy="62.5" rx="3.3" ry="4.3" fill="url(#alEye)" stroke="#10203e" stroke-width="1.5"/>
    <ellipse cx="55.5" cy="62.5" rx="3.3" ry="4.3" fill="url(#alEye)" stroke="#10203e" stroke-width="1.5"/>
    <circle cx="39.3" cy="61" r="1.15" fill="#ffffff"/>
    <circle cx="41.7" cy="63.8" r=".6" fill="#ffffff" opacity=".85"/>
    <circle cx="54.3" cy="61" r="1.15" fill="#ffffff"/>
    <circle cx="56.7" cy="63.8" r=".6" fill="#ffffff" opacity=".85"/>
    <!-- 无口小嘴 + 鼻 + 腮红 -->
    <path d="M 47.6,67 L 48.3,67.7" fill="none" stroke="#10203e" stroke-width="1.3" opacity=".7"/>
    <path d="M 45.6,70.8 Q 48,72.4 50.4,70.8" fill="none" stroke="#10203e" stroke-width="2"/>
    <ellipse cx="34.8" cy="67" rx="2.8" ry="1.8" fill="#ff9fb2" opacity=".5"/>
    <ellipse cx="61.2" cy="67" rx="2.8" ry="1.8" fill="#ff9fb2" opacity=".5"/>
    <!-- 白衬衫黑领带 -->
    <path d="M 30,80 Q 48,72.5 66,80 L 70,96 L 26,96 Z" fill="#ffffff" stroke="#10203e" stroke-width="2"/>
    <path d="M 41.5,76.5 L 48,81.5 L 54.5,76.5 L 51.5,74.5 L 48,77.5 L 44.5,74.5 Z" fill="#ffffff" stroke="#10203e" stroke-width="1.6"/>
    <path d="M 45.2,78 L 50.8,78 L 52.2,82 L 48,85 L 43.8,82 Z" fill="url(#alTie)" stroke="#10203e" stroke-width="1.6"/>
    <path d="M 46.4,85 L 49.6,85 L 50.6,93.5 L 45.4,93.5 Z" fill="url(#alTie)" stroke="#10203e" stroke-width="1.5"/>
  </g>
</svg>
