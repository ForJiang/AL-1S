<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="300" height="420" viewBox="0 0 300 420">
  <title>记忆局限六：系统就绪（六边形终端·数据点·进度环）</title>
  <defs>
    <linearGradient id="m6Bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8faff"/>
      <stop offset="55%" stop-color="#b9e8f7"/>
      <stop offset="100%" stop-color="#8fd4ee"/>
