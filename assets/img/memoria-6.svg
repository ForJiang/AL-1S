      <circle cx="171" cy="160" r="5"/>
      <circle cx="129" cy="160" r="5"/>
      <circle cx="111" cy="128" r="5"/>
      <circle cx="129" cy="96" r="5"/>
      <circle cx="171" cy="96" r="5"/>
