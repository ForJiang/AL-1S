    <g fill="#54e3ff" opacity=".9">
      <path d="M 246,292 L 247.4,296.6 L 252,298 L 247.4,299.4 L 246,304 L 244.6,299.4 L 240,298 L 244.6,296.6 Z"/>
      <path d="M 262,296 L 263,299.6 L 266.6,301 L 263,302.4 L 262,306 L 261,302.4 L 257.4,301 L 261,299.6 Z"/>
      <path d="M 276,290 L 277.6,295.2 L 282.8,296.8 L 277.6,298.4 L 276,303.6 L 274.4,298.4 L 269.2,296.8 L 274.4,295.2 Z"/>
