      <rect x="26" y="186" width="9" height="9" rx="2.5"/>
      <rect x="265" y="150" width="9" height="9" rx="2.5"/>
      <rect x="265" y="168" width="9" height="9" rx="2.5"/>
      <rect x="265" y="186" width="9" height="9" rx="2.5"/>
