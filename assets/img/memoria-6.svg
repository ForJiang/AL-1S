      <stop offset="100%" stop-color="#54e3ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="m6Bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1428"/>
      <stop offset="100%" stop-color="#10203e"/>
    </linearGradient>
  </defs>
  <g stroke-linejoin="round" stroke-linecap="round">
