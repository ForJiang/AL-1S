      <path d="M 212,26 L 214,32.4 L 220.4,34.4 L 214,36.4 L 212,43 L 210,36.4 L 203.6,34.4 L 210,32.4 Z"/>
      <path d="M 150,214 L 152,220.4 L 158.4,222.4 L 152,224.4 L 150,231 L 148,224.4 L 141.6,222.4 L 148,220.4 Z"/>
