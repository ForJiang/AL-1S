      <path d="M 40,58 Q 40,46 54,46 Q 60,36 74,42 Q 86,42 86,52 Q 94,54 92,62 L 42,62 Q 34,62 40,58 Z"/>
      <path d="M 206,84 Q 206,74 218,74 Q 224,66 236,70 Q 246,70 246,78 Q 252,80 250,86 L 208,86 Q 200,86 206,84 Z"/>
    </g>
    <!-- 远方六边形废墟 -->
