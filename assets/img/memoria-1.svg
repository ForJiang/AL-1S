    <line x1="56" y1="60" x2="82" y2="106" stroke="#10203e" stroke-width="5.5"/>
    <line x1="56" y1="60" x2="82" y2="106" stroke="#9af0e8" stroke-width="2" opacity=".5"/>
    <path d="M 74,102 L 100,98 Q 112,106 110,120 Q 98,130 82,126 Q 72,116 74,102 Z"
