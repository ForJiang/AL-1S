      <rect x="146" y="176" width="8" height="8" rx="2" fill="#9af0e8" transform="rotate(-14 150 180)"/>
    </g>
    <!-- 深蓝信息条 -->
    <rect y="260" width="300" height="160" fill="url(#m1Bar)"/>
    <rect y="260" width="300" height="3" fill="#ffd94a"/>
    <rect y="263" width="300" height="26" fill="#ffffff" opacity=".05"/>
    <polygon points="26,288 36,293.5 36,302.5 26,308 16,302.5 16,293.5" fill="none" stroke="#4aa8f0" stroke-width="2"/>
    <circle cx="26" cy="298" r="3" fill="#ffd94a"/>
    <g fill="#ffd94a" opacity=".9">
      <path d="M 246,292 L 247.4,296.6 L 252,298 L 247.4,299.4 L 246,304 L 244.6,299.4 L 240,298 L 244.6,296.6 Z"/>
      <path d="M 262,296 L 263,299.6 L 266.6,301 L 263,302.4 L 262,306 L 261,302.4 L 257.4,301 L 261,299.6 Z"/>
      <path d="M 276,290 L 277.6,295.2 L 282.8,296.8 L 277.6,298.4 L 276,303.6 L 274.4,298.4 L 269.2,296.8 L 274.4,295.2 Z"/>
