    <g stroke="#10203e" stroke-width="1.8">
      <g fill="url(#m1Hex)">
        <polygon points="17,197.5 30,190 43,197.5 43,212.5 30,220 17,212.5"/>
        <polygon points="63,197.5 76,190 89,197.5 89,212.5 76,220 63,212.5"/>
        <polygon points="109,197.5 122,190 135,197.5 135,212.5 122,220 109,212.5"/>
        <polygon points="155,197.5 168,190 181,197.5 181,212.5 168,220 155,212.5"/>
        <polygon points="201,197.5 214,190 227,197.5 227,212.5 214,220 201,212.5"/>
        <polygon points="247,197.5 260,190 273,197.5 273,212.5 260,220 247,212.5"/>
