    <rect width="300" height="420" fill="url(#m1Bg)"/>
    <circle cx="150" cy="96" r="88" fill="url(#m1Sun)"/>
    <circle cx="150" cy="95" r="24" fill="#ffd94a" stroke="#ffc93c" stroke-width="2.5"/>
    <circle cx="150" cy="95" r="30" fill="none" stroke="#ffc93c" stroke-width="2" opacity=".55"/>
    <g fill="#ffe9a0" opacity=".4">
