    <line x1="16" y1="322" x2="284" y2="322" stroke="#22406e" stroke-width="2"/>
    <!-- 卡框 -->
    <rect x="1" y="1" width="298" height="418" fill="none" stroke="#10203e" stroke-width="2"/>
  </g>
</svg>
