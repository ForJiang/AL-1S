    <g fill="#ffd94a" stroke="#10203e" stroke-width="1.2">
      <path d="M 216,64 L 218.6,71.4 L 226,74 L 218.6,76.6 L 216,84 L 213.4,76.6 L 206,74 L 213.4,71.4 Z"/>
      <path d="M 264,120 L 266,126 L 272,128 L 266,130 L 264,136 L 262,130 L 256,128 L 262,126 Z"/>
      <path d="M 186,150 L 188,156 L 194,158 L 188,160 L 186,166 L 184,160 L 178,158 L 184,156 Z"/>
    </g>
    <g fill="#ffffff" opacity=".7">
      <circle cx="240" cy="52" r="2.4"/>
      <circle cx="132" cy="70" r="2"/>
      <circle cx="180" cy="42" r="1.8"/>
      <circle cx="272" cy="88" r="2.2"/>
      <circle cx="96" cy="46" r="1.8"/>
    </g>
    <g stroke="#10203e" stroke-width="1.5">
