        <polygon points="63,212.5 89,212.5 89,224 76,230 63,224"/>
        <polygon points="109,212.5 135,212.5 135,224 122,230 109,224"/>
        <polygon points="155,212.5 181,212.5 181,224 168,230 155,224"/>
        <polygon points="201,212.5 227,212.5 227,224 214,230 201,224"/>
        <polygon points="247,212.5 273,212.5 273,224 260,230 247,224"/>
