      <line x1="89" y1="128" x2="88" y2="138"/>
      <line x1="98" y1="127" x2="99" y2="136"/>
      <line x1="106" y1="123" x2="109" y2="131"/>
    </g>
    <!-- 声波 -->
    <g fill="none" stroke="#35d0c0" stroke-width="3.5">
