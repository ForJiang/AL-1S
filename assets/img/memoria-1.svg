<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="300" height="420" viewBox="0 0 300 420">
  <title>记忆局限一：废墟的觉醒（扫帚·声波·六边形地平线）</title>
  <defs>
    <linearGradient id="m1Bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8fdff0"/>
      <stop offset="52%" stop-color="#c9f2e8"/>
      <stop offset="100%" stop-color="#ffe9a4"/>
    </linearGradient>
    <radialGradient id="m1Sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd94a" stop-opacity=".85"/>
      <stop offset="60%" stop-color="#ffd94a" stop-opacity=".25"/>
      <stop offset="100%" stop-color="#ffd94a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="m1Hex" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c9ecf5"/>
    </linearGradient>
    <linearGradient id="m1Bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1428"/>
      <stop offset="100%" stop-color="#10203e"/>
    </linearGradient>
  </defs>
  <g stroke-linejoin="round" stroke-linecap="round">
