<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96">
  <title>头像：才羽桃（橘棕短发·猫耳兜帽·露齿笑）</title>
  <defs>
    <radialGradient id="moBg" cx="50%" cy="34%" r="80%">
      <stop offset="0%" stop-color="#fff7f9"/>
      <stop offset="55%" stop-color="#ffd9e2"/>
      <stop offset="100%" stop-color="#ffb9c9"/>
    </radialGradient>
    <linearGradient id="moHair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d38247"/>
      <stop offset="100%" stop-color="#a85c28"/>
    </linearGradient>
    <linearGradient id="moEye" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd94a"/>
      <stop offset="100%" stop-color="#f08a1e"/>
    </linearGradient>
  </defs>
  <g stroke-linejoin="round" stroke-linecap="round">
    <!-- 浅粉圆底 -->
    <circle cx="48" cy="48" r="46" fill="url(#moBg)"/>
    <circle cx="48" cy="48" r="42.5" fill="none" stroke="#ffffff" stroke-width="1.6" opacity=".6"/>
    <!-- 猫耳兜帽：白外壳 + 粉内侧 -->
    <g>
      <path d="M 25,42 C 20,24 27,12 40,23 C 44,27 44,36 41,43 Z" fill="#ffffff" stroke="#10203e" stroke-width="2.2"/>
      <path d="M 28.5,38 C 26,28 30,20 37,27 C 39,30 39,34 37.5,38 Z" fill="#ff9fb2" stroke="#10203e" stroke-width="1.5"/>
      <path d="M 71,42 C 76,24 69,12 56,23 C 52,27 52,36 55,43 Z" fill="#ffffff" stroke="#10203e" stroke-width="2.2"/>
      <path d="M 67.5,38 C 70,28 66,20 59,27 C 57,30 57,34 58.5,38 Z" fill="#ff9fb2" stroke="#10203e" stroke-width="1.5"/>
    </g>
    <!-- 头与脸 -->
    <circle cx="48" cy="55" r="24" fill="url(#moHair)" stroke="#10203e" stroke-width="2.5"/>
    <circle cx="48" cy="57" r="19.5" fill="#fff1e6" stroke="#10203e" stroke-width="2.2"/>
    <!-- 兜帽下缘 + 短刘海分缕 -->
    <path d="M 27,50 Q 48,41 69,50 L 66,57 Q 48,49 30,57 Z" fill="#ffffff" stroke="#10203e" stroke-width="2"/>
    <path d="M 31,53 Q 48,46 65,53 L 62,55.5 Q 48,49.5 34,55.5 Z" fill="#ff9fb2" opacity=".85"/>
    <path d="M 29.5,51 Q 29,38 48,36.5 Q 67,38 66.5,51 L 62,47.5 L 58,52 L 54,47.8 L 48,52 L 42,47.8 L 38,52 L 34,47.5 Z"
          fill="url(#moHair)" stroke="#10203e" stroke-width="2"/>
    <path d="M 36,43 Q 42,37.5 52,38.5" fill="none" stroke="#ffffff" stroke-width="2.4" opacity=".4"/>
    <path d="M 55,40 Q 59,42 61,46" fill="none" stroke="#ffffff" stroke-width="1.6" opacity=".3"/>
    <!-- 侧发缕 -->
    <path d="M 30,50 Q 26,62 28,74 L 33,72 Q 31,62 33,53 Z" fill="url(#moHair)" stroke="#10203e" stroke-width="1.8"/>
    <path d="M 66,50 Q 70,62 68,74 L 63,72 Q 65,62 63,53 Z" fill="url(#moHair)" stroke="#10203e" stroke-width="1.8"/>
    <!-- 眉眼（金橙活力眼） -->
    <path d="M 36.6,56.8 Q 40,55 43.2,56.8" fill="none" stroke="#10203e" stroke-width="1.7"/>
    <path d="M 52.8,56.8 Q 56,55 59.4,56.8" fill="none" stroke="#10203e" stroke-width="1.7"/>
    <ellipse cx="40.5" cy="63" rx="3.5" ry="4.5" fill="url(#moEye)" stroke="#10203e" stroke-width="1.5"/>
    <ellipse cx="55.5" cy="63" rx="3.5" ry="4.5" fill="url(#moEye)" stroke="#10203e" stroke-width="1.5"/>
    <circle cx="39.2" cy="61.4" r="1.2" fill="#ffffff"/>
    <circle cx="41.8" cy="64.4" r=".6" fill="#ffffff" opacity=".85"/>
    <circle cx="54.2" cy="61.4" r="1.2" fill="#ffffff"/>
    <circle cx="56.8" cy="64.4" r=".6" fill="#ffffff" opacity=".85"/>
    <!-- 露齿活力笑 -->
    <path d="M 41.5,69 Q 48,76.5 54.5,69 Q 48,72.8 41.5,69 Z" fill="#10203e" stroke="#10203e" stroke-width="1.6"/>
    <path d="M 43.4,69.5 L 52.6,69.5 L 51.4,72.2 L 44.6,72.2 Z" fill="#ffffff"/>
    <ellipse cx="35" cy="67.5" rx="2.9" ry="1.8" fill="#ff9fb2" opacity=".55"/>
    <ellipse cx="61" cy="67.5" rx="2.9" ry="1.8" fill="#ff9fb2" opacity=".55"/>
    <!-- 兜帽系带结 -->
    <path d="M 44,84 Q 48,87 52,84" fill="none" stroke="#ffffff" stroke-width="2.4"/>
    <path d="M 44,84 Q 48,87 52,84" fill="none" stroke="#10203e" stroke-width="1" opacity=".35"/>
    <circle cx="48" cy="87.6" r="2" fill="#ffffff" stroke="#10203e" stroke-width="1.4"/>
    <circle cx="48" cy="87.6" r=".7" fill="#ff9fb2"/>
  </g>
</svg>
