<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40">
  <title>45度蓝白斜条平铺背景</title>
  <defs>
    <pattern id="stripep" width="28" height="28" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect x="0" y="0" width="14" height="28" fill="#ffffff"/>
      <rect x="14" y="0" width="14" height="28" fill="#c8e8ff"/>
    </pattern>
  </defs>
  <rect width="40" height="40" fill="url(#stripep)"/>
</svg>
