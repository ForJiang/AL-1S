<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96">
  <title>头像：花冈柚子（粉色长发·困倦半闭眼）</title>
  <defs>
    <radialGradient id="yuBg" cx="50%" cy="34%" r="80%">
      <stop offset="0%" stop-color="#fff8ee"/>
      <stop offset="55%" stop-color="#ffe6c8"/>
      <stop offset="100%" stop-color="#ffc79a"/>
    </radialGradient>
    <linearGradient id="yuHair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbb6c8"/>
      <stop offset="100%" stop-color="#e27f9e"/>
    </linearGradient>
    <linearGradient id="yuEye" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffb35c"/>
      <stop offset="100%" stop-color="#ef7f2a"/>
    </linearGradient>
  </defs>
  <g stroke-linejoin="round" stroke-linecap="round">
    <!-- 浅橙圆底 -->
    <circle cx="48" cy="48" r="46" fill="url(#yuBg)"/>
    <circle cx="48" cy="48" r="42.5" fill="none" stroke="#ffffff" stroke-width="1.6" opacity=".6"/>
    <!-- 过肩长发（后层，分缕+高光） -->
    <path d="M 48,26 C 72,26 79,52 77,80 L 71,90 L 25,90 L 19,80 C 17,52 24,26 48,26 Z"
          fill="url(#yuHair)" stroke="#10203e" stroke-width="2.5"/>
    <path d="M 30,40 Q 24,62 27,84" fill="none" stroke="#c95f80" stroke-width="2" opacity=".55"/>
    <path d="M 66,40 Q 72,62 69,84" fill="none" stroke="#c95f80" stroke-width="2" opacity=".55"/>
    <path d="M 39,34 Q 34,58 36,84" fill="none" stroke="#ffffff" stroke-width="2.2" opacity=".5"/>
    <path d="M 58,34 Q 63,58 61,84" fill="none" stroke="#ffffff" stroke-width="2.2" opacity=".4"/>
    <!-- 头与脸 -->
    <circle cx="48" cy="53" r="23.5" fill="url(#yuHair)" stroke="#10203e" stroke-width="2.5"/>
    <circle cx="48" cy="56" r="19" fill="#fff1e6" stroke="#10203e" stroke-width="2.2"/>
    <!-- 刘海（中分微卷） -->
    <path d="M 29.5,49 Q 29,36 48,34.5 Q 67,36 66.5,49 L 62,45.5 L 57.5,50.5 L 52,45.5 L 48,51 L 44,45.5 L 38.5,50.5 L 34,45.5 Z"
          fill="url(#yuHair)" stroke="#10203e" stroke-width="2"/>
    <path d="M 36,41.5 Q 42,36 51,37" fill="none" stroke="#ffffff" stroke-width="2.4" opacity=".5"/>
    <path d="M 55,39 Q 59,41 61.5,45" fill="none" stroke="#ffffff" stroke-width="1.6" opacity=".4"/>
    <!-- 侧发缕垂肩 -->
    <path d="M 30,48 Q 25,64 27,78 L 32,76 Q 30,64 32.5,51 Z" fill="url(#yuHair)" stroke="#10203e" stroke-width="1.8"/>
    <path d="M 66,48 Q 71,64 69,78 L 64,76 Q 66,64 63.5,51 Z" fill="url(#yuHair)" stroke="#10203e" stroke-width="1.8"/>
    <!-- 困倦半闭眼（下弯眼线 + 半阖眼眸） -->
    <path d="M 36,62 Q 40.5,66.5 45,62" fill="none" stroke="#10203e" stroke-width="1.9"/>
    <path d="M 51,62 Q 55.5,66.5 60,62" fill="none" stroke="#10203e" stroke-width="1.9"/>
    <ellipse cx="40.5" cy="63.6" rx="3" ry="2" fill="url(#yuEye)" stroke="#10203e" stroke-width="1.3"/>
    <ellipse cx="55.5" cy="63.6" rx="3" ry="2" fill="url(#yuEye)" stroke="#10203e" stroke-width="1.3"/>
    <circle cx="39.6" cy="63" r=".9" fill="#ffffff"/>
    <circle cx="54.6" cy="63" r=".9" fill="#ffffff"/>
    <!-- 小嘴 + 腮红 -->
    <path d="M 45.8,70.6 Q 48,72 50.2,70.6" fill="none" stroke="#10203e" stroke-width="1.9"/>
    <ellipse cx="35" cy="67.5" rx="2.9" ry="1.8" fill="#ff9fb2" opacity=".55"/>
    <ellipse cx="61" cy="67.5" rx="2.9" ry="1.8" fill="#ff9fb2" opacity=".55"/>
    <!-- 发顶蝴蝶结小饰 -->
    <path d="M 48,31 L 41,27 L 41,35 Z" fill="#ffd94a" stroke="#10203e" stroke-width="1.5"/>
    <path d="M 48,31 L 55,27 L 55,35 Z" fill="#ffd94a" stroke="#10203e" stroke-width="1.5"/>
    <circle cx="48" cy="31" r="1.8" fill="#ffc93c" stroke="#10203e" stroke-width="1.3"/>
  </g>
</svg>
