<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96">
  <title>头像：才羽绿（金绿短发·猫耳兜帽·温柔眯眼笑）</title>
  <defs>
    <radialGradient id="miBg" cx="50%" cy="34%" r="80%">
      <stop offset="0%" stop-color="#f6fdf4"/>
      <stop offset="55%" stop-color="#d9f5dd"/>
      <stop offset="100%" stop-color="#a9dfb4"/>
    </radialGradient>
    <linearGradient id="miHair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e3ec9a"/>
      <stop offset="100%" stop-color="#b3c65a"/>
    </linearGradient>
    <linearGradient id="miEye" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8fd99a"/>
      <stop offset="100%" stop-color="#3f9e52"/>
    </linearGradient>
  </defs>
  <g stroke-linejoin="round" stroke-linecap="round">
    <!-- 浅绿圆底 -->
    <circle cx="48" cy="48" r="46" fill="url(#miBg)"/>
    <circle cx="48" cy="48" r="42.5" fill="none" stroke="#ffffff" stroke-width="1.6" opacity=".6"/>
    <!-- 猫耳兜帽：白外壳 + 绿内侧 -->
    <g>
      <path d="M 25,42 C 20,24 27,12 40,23 C 44,27 44,36 41,43 Z" fill="#ffffff" stroke="#10203e" stroke-width="2.2"/>
      <path d="M 28.5,38 C 26,28 30,20 37,27 C 39,30 39,34 37.5,38 Z" fill="#7fcf8c" stroke="#10203e" stroke-width="1.5"/>
      <path d="M 71,42 C 76,24 69,12 56,23 C 52,27 52,36 55,43 Z" fill="#ffffff" stroke="#10203e" stroke-width="2.2"/>
      <path d="M 67.5,38 C 70,28 66,20 59,27 C 57,30 57,34 58.5,38 Z" fill="#7fcf8c" stroke="#10203e" stroke-width="1.5"/>
    </g>
    <!-- 头与脸 -->
    <circle cx="48" cy="55" r="24" fill="url(#miHair)" stroke="#10203e" stroke-width="2.5"/>
    <circle cx="48" cy="57" r="19.5" fill="#fff1e6" stroke="#10203e" stroke-width="2.2"/>
    <!-- 兜帽下缘 + 短刘海分缕 -->
    <path d="M 27,50 Q 48,41 69,50 L 66,57 Q 48,49 30,57 Z" fill="#ffffff" stroke="#10203e" stroke-width="2"/>
    <path d="M 31,53 Q 48,46 65,53 L 62,55.5 Q 48,49.5 34,55.5 Z" fill="#7fcf8c" opacity=".8"/>
    <path d="M 29.5,51 Q 29,38 48,36.5 Q 67,38 66.5,51 L 62,47.5 L 58,52 L 54,47.8 L 48,52 L 42,47.8 L 38,52 L 34,47.5 Z"
          fill="url(#miHair)" stroke="#10203e" stroke-width="2"/>
    <path d="M 36,43 Q 42,37.5 52,38.5" fill="none" stroke="#ffffff" stroke-width="2.4" opacity=".55"/>
    <path d="M 55,40 Q 59,42 61,46" fill="none" stroke="#ffffff" stroke-width="1.6" opacity=".45"/>
    <!-- 侧发缕 -->
    <path d="M 30,50 Q 26,62 28,74 L 33,72 Q 31,62 33,53 Z" fill="url(#miHair)" stroke="#10203e" stroke-width="1.8"/>
    <path d="M 66,50 Q 70,62 68,74 L 63,72 Q 65,62 63,53 Z" fill="url(#miHair)" stroke="#10203e" stroke-width="1.8"/>
    <!-- 温柔眯眼笑（下弯眼线 + 绿叶小眼） -->
    <path d="M 36.4,61.6 Q 40.5,65.6 44.6,61.6" fill="none" stroke="#10203e" stroke-width="1.9"/>
    <path d="M 51.4,61.6 Q 55.5,65.6 59.6,61.6" fill="none" stroke="#10203e" stroke-width="1.9"/>
    <ellipse cx="40.5" cy="63.6" rx="2.6" ry="2.1" fill="url(#miEye)" stroke="#10203e" stroke-width="1.3"/>
    <ellipse cx="55.5" cy="63.6" rx="2.6" ry="2.1" fill="url(#miEye)" stroke="#10203e" stroke-width="1.3"/>
    <circle cx="39.7" cy="62.9" r=".9" fill="#ffffff"/>
    <circle cx="54.7" cy="62.9" r=".9" fill="#ffffff"/>
    <!-- 微笑 + 腮红 -->
    <path d="M 44.6,70.4 Q 48,73 51.4,70.4" fill="none" stroke="#10203e" stroke-width="2"/>
    <ellipse cx="35" cy="67.5" rx="2.9" ry="1.8" fill="#ff9fb2" opacity=".55"/>
    <ellipse cx="61" cy="67.5" rx="2.9" ry="1.8" fill="#ff9fb2" opacity=".55"/>
    <!-- 兜帽系带结 -->
    <path d="M 44,84 Q 48,87 52,84" fill="none" stroke="#ffffff" stroke-width="2.4"/>
    <path d="M 44,84 Q 48,87 52,84" fill="none" stroke="#10203e" stroke-width="1" opacity=".35"/>
    <circle cx="48" cy="87.6" r="2" fill="#ffffff" stroke="#10203e" stroke-width="1.4"/>
    <circle cx="48" cy="87.6" r=".7" fill="#7fcf8c"/>
  </g>
</svg>
