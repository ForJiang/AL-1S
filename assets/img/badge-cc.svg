<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120">
  <title>游戏开发部徽章：盾形·猫耳兜帽剪影·手柄按键·像素星星</title>
  <defs>
    <linearGradient id="ccBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eefaff"/>
      <stop offset="60%" stop-color="#c9ecf7"/>
      <stop offset="100%" stop-color="#9ad8f0"/>
    </linearGradient>
    <radialGradient id="ccShine" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g stroke-linejoin="round" stroke-linecap="round">
    <!-- 盾形底 -->
    <path d="M 60,6 L 106,22 L 106,58 C 106,86 88,102 60,114 C 32,102 14,86 14,58 L 14,22 Z"
          fill="url(#ccBg)" stroke="#10203e" stroke-width="3.5"/>
    <path d="M 60,6 L 106,22 L 106,58 C 106,86 88,102 60,114 C 32,102 14,86 14,58 L 14,22 Z"
          fill="url(#ccShine)"/>
    <path d="M 60,16 L 97,29 L 97,57 C 97,80 83,93 60,103 C 37,93 23,80 23,57 L 23,29 Z"
          fill="none" stroke="#2f8fe8" stroke-width="2" opacity=".85"/>
    <path d="M 26,34 Q 20,58 28,82" fill="none" stroke="#ffffff" stroke-width="3.4" opacity=".5"/>
    <!-- 猫耳兜帽剪影 -->
    <g stroke="#10203e" stroke-width="2.2">
      <path d="M 36,40 C 32,24 38,14 50,24 C 54,28 54,36 51,42 Z" fill="#ffffff"/>
      <path d="M 39,36 C 37,26 40,20 46,27 C 48,30 48,34 46,38 Z" fill="#9af0e8"/>
      <path d="M 84,40 C 88,24 82,14 70,24 C 66,28 66,36 69,42 Z" fill="#ffffff"/>
      <path d="M 81,36 C 83,26 80,20 74,27 C 72,30 72,34 74,38 Z" fill="#9af0e8"/>
      <path d="M 34,56 Q 36,32 60,30 Q 84,32 86,56 Q 60,44 34,56 Z" fill="#ffffff"/>
    </g>
    <path d="M 42,40 Q 46,33 56,32" fill="none" stroke="#ffffff" stroke-width="2.6" opacity=".9"/>
    <!-- 像素星星（兜帽上的部徽） -->
    <g fill="#ffd94a" stroke="#10203e" stroke-width=".7">
      <rect x="58.5" y="34" width="3" height="3"/>
      <rect x="55.5" y="37" width="3" height="3"/>
      <rect x="58.5" y="37" width="3" height="3"/>
      <rect x="61.5" y="37" width="3" height="3"/>
      <rect x="52.5" y="40" width="3" height="3"/>
      <rect x="55.5" y="40" width="3" height="3"/>
      <rect x="58.5" y="40" width="3" height="3"/>
      <rect x="61.5" y="40" width="3" height="3"/>
      <rect x="64.5" y="40" width="3" height="3"/>
      <rect x="55.5" y="43" width="3" height="3"/>
      <rect x="61.5" y="43" width="3" height="3"/>
      <rect x="52.5" y="46" width="3" height="3"/>
      <rect x="64.5" y="46" width="3" height="3"/>
    </g>
    <!-- 手柄按键 △○×□ -->
    <path d="M 48,60 L 56,72 L 40,72 Z" fill="#ffd94a" stroke="#10203e" stroke-width="2.2"/>
    <circle cx="72" cy="68" r="7.5" fill="#35d0c0" stroke="#10203e" stroke-width="2.2"/>
    <rect x="41" y="81" width="14" height="14" rx="3" fill="#4aa8f0" stroke="#10203e" stroke-width="2.2"/>
    <path d="M 66,82 L 78,94 M 78,82 L 66,94" fill="none" stroke="#10203e" stroke-width="3.2"/>
    <!-- 底部绶带 -->
    <g stroke="#10203e" stroke-width="2">
      <path d="M 46,99 L 74,99 L 74,107 L 46,107 Z" fill="#ffd94a"/>
      <path d="M 46,99 L 38,95 L 38,109 L 46,107 Z" fill="#ffc93c"/>
      <path d="M 74,99 L 82,95 L 82,109 L 74,107 Z" fill="#ffc93c"/>
    </g>
    <!-- 侧饰与星芒 -->
    <g fill="#ffd94a" stroke="#10203e" stroke-width="1.5">
      <circle cx="30" cy="46" r="2.6"/>
      <circle cx="90" cy="46" r="2.6"/>
    </g>
    <g fill="none" stroke="#2f8fe8" stroke-width="2">
      <polygon points="30,80 36,83 36,89 30,92 24,89 24,83"/>
      <polygon points="90,80 96,83 96,89 90,92 84,89 84,83"/>
    </g>
    <path d="M 90,64 L 91.6,68.2 L 96,69.8 L 91.6,71.4 L 90,75.6 L 88.4,71.4 L 84,69.8 L 88.4,68.2 Z"
          fill="#ffd94a" stroke="#10203e" stroke-width="1.2"/>
    <path d="M 30,64 L 31.6,68.2 L 36,69.8 L 31.6,71.4 L 30,75.6 L 28.4,71.4 L 24,69.8 L 28.4,68.2 Z"
          fill="#ffd94a" stroke="#10203e" stroke-width="1.2"/>
  </g>
</svg>
